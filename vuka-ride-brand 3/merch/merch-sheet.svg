e, white: back</text><rect x="60" y="1360" width="400" height="490" rx="24" fill="#FFFFFF"/><image x="100" y="1400" width="320" height="320" xlink:href="svg/badge-embroidery.svg"/><text x="260" y="1805" text-anchor="middle" font-family="Poppins" font-size="17" fill="#4B5563">Embroidered badge / cap patch</text><rect x="480" y="1360" width="640" height="490" rx="24" fill="#FFFFFF"/><rect x="510" y="1410" width="580" height="365.6" rx="24" fill="none" stroke="#D1D5DB" stroke-width="2"/><image x="510" y="1410" width="580" height="365.6" xlink:href="svg/driver-id-card-template.svg"/><text x="800" y="1815" text-anchor="middle" font-family="Poppins" font-size="17" fill="#4B5563">Driver ID card (template)</text><rect x="1140" y="1360" width="260" height="490" rx="24" fill="#FFFFFF"/><image x="1160" y="1470" width="220" height="220" xlink:href="svg/sticker-round.svg"/><text x="1270" y="1805" text-anchor="middle" font-family="Poppins" font-size="17" fill="#4B5563">Round sticker</text><rect x="1420" y="1360" width="320" height="490" rx="24" fill="#FFFFFF"/><image x="1435" y="1540" width="290" height="72.5" xlink:href="svg/sticker-bumper.svg"/><text x="1580" y="1805" text-anchor="middle" font-family="Poppins" font-size="17" fill="#4B5563">Bumper sticker</text></svg>